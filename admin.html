<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Problem Report – Report tools</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>const FACTORIES = ['Ayutthaya', 'Terahop 5000', 'Pinewave'];</script>
<script src="pr-core.js"></script>
<style>
body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;color:#222;background:#f6f7f9}
main{max-width:1200px;margin:0 auto;padding:16px}h2{margin:22px 0 8px;font-size:17px}
table{border-collapse:collapse;width:100%;background:#fff;font-size:13px}th,td{border:1px solid #ddd;padding:6px 8px;text-align:left}
td.red{background:#d93025;color:#fff;font-weight:bold}
button{padding:7px 14px;margin:0 6px 6px 0;border:0;border-radius:4px;background:#1a73e8;color:#fff;cursor:pointer}
input{padding:6px;margin-right:6px}pre{background:#fff;border:1px solid #ddd;padding:10px;font-size:13px;white-space:pre-wrap}
dialog{padding:0;border:0;border-radius:6px;width:480px;max-width:92vw}
.hd{background:#d93025;color:#fff;padding:16px 20px;font-size:19px;font-weight:bold}
.bd{padding:12px 20px;max-height:270px;overflow:auto}.it{padding:8px 0;border-bottom:1px solid #eee;font-size:14px}.it span{color:#d93025;font-weight:bold}
.ft{padding:0 20px 6px;font-size:13px;color:#555}.ok{margin:8px 20px 16px;padding:9px 34px;background:#d93025}
</style></head>
<body><main>
<div id="login"><h2>Sign in</h2><input id="em" type="email" placeholder="email"><input id="pw" type="password" placeholder="password"><button id="btnIn">Sign in</button><span id="loginMsg"></span></div>
<div id="app" hidden>
  <h2>Report tools</h2>
  <button id="bIssues">Add new issues to IssueMapping</button><button id="bMach">Add new machines to MachineMapping</button>
  <button id="bSkill">Create SkillWeb names</button><button id="bCheck">Check unmatched + module data</button><span id="toolMsg"></span>
  <pre id="checkOut" hidden></pre>
  <h2>⚠ Downtime – waiting for check</h2><div id="pend"></div>
  <h2>Confirmed</h2><div id="done"></div>
</div>
<dialog id="dlg"><div class="hd" id="dlgTitle"></div><div class="bd" id="dlgBody"></div>
  <div class="ft">แก้ค่าให้ถูกต้อง หรือติ๊ก Confirm เพื่อยืนยัน แล้วแถวจะออกจากรายการ / fix the data or tick Confirm.</div>
  <button class="ok" onclick="document.getElementById('dlg').close()">OK</button></dialog>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MAX = 600, seen = new Set();
const kindText = (k, v) => k === 'error' ? 'error (ไม่มีเวลาที่คำนวณได้)' : k === 'negative' ? 'ติดลบ ' + v : 'เกิน ' + MAX + ' นาที: ' + v;
const label = r => {
  const m = rowOf_(r), t = /^\d{4}-(\d\d)-(\d\d)T(\d\d):(\d\d)/.exec(toLocal_(fv_(m, 'timestamp', 'ts')) || '');
  return [r.factory, fv_(m, 'raw_machine_name'), fv_(m, 'machine_number')].filter(Boolean).join(' ') + (t ? ` | ${t[2]}/${t[1]} ${t[3]}:${t[4]}` : '');
};
const table = rows => rows.length ? '<table><tr><th>Confirm</th><th>Row</th><th>Machine | time</th><th>维修总时间(min)</th></tr>' + rows.map(r =>
  `<tr><td><input type="checkbox" data-id="${esc(r.id)}"${r.confirmed === true ? ' checked disabled' : ''}></td><td>${esc(r.id)}</td><td>${esc(label(r))}</td>` +
  `<td class="${r.confirmed === true ? '' : 'red'}">${esc(r.repair_minutes ?? '#ERROR')} <small>${esc(kindText(r.kind, r.repair_minutes))}</small></td></tr>`).join('') + '</table>' : '<p>— none —</p>';

function popup(total, items) {                                 // pop-up in the middle of the screen, red title bar
  $('dlgTitle').textContent = '⚠ ' + total + ' แถวผิดปกติ ย้ายขึ้นบนสุดแล้ว';
  $('dlgBody').innerHTML = items.slice(0, 12).map(r => `<div class="it"><b>${esc(label(r))}</b><br><span>${esc('维修总时间 → ' + kindText(r.kind, r.repair_minutes))}</span></div>`).join('') + (items.length > 12 ? `<div>… +${items.length - 12}</div>` : '');
  if (!$('dlg').open) $('dlg').showModal();
}
async function review(announce) {
  const { data, error } = await supabaseClient.from('pr_logs_check').select('*').order('id');
  if (error) { $('toolMsg').textContent = error.message; return; }
  const pend = data.filter(r => r.confirmed !== true), done = data.filter(r => r.confirmed === true);   // pending = top of the page
  $('pend').innerHTML = table(pend); $('done').innerHTML = table(done);
  document.querySelectorAll('#pend input[data-id]').forEach(b => b.onchange = async () => {
    const { error } = await supabaseClient.from('pr_logs').update({ confirmed: true }).eq('id', b.dataset.id);
    if (error) { b.checked = false; $('toolMsg').textContent = error.message; } else review(false);
  });
  const fresh = pend.filter(r => !seen.has(r.id)); pend.forEach(r => seen.add(r.id));
  if (announce && fresh.length) popup(pend.length, fresh);
}
async function rpc(fn, what) {
  $('toolMsg').textContent = '…';
  const { data, error } = await supabaseClient.rpc(fn);
  $('toolMsg').textContent = error ? error.message : (data ? data + ' new row(s) added to ' + what + ' – fill in the Chinese columns you need.' : 'Nothing new – already in ' + what + '.');
}
async function checks() {                                       // = listUnmatched + checkModuleData
  $('checkOut').hidden = false; $('checkOut').textContent = '…';
  try {
    const rows = (await fetchPayload()).data.filter(r => !r.noMachine), out = [], un = {};
    rows.filter(r => !r.brandEn).forEach(r => un[r.machineRaw] = (un[r.machineRaw] || 0) + 1);
    out.push(Object.keys(un).length ? 'No keyword row for:\n' + Object.keys(un).map(k => k + '  (' + un[k] + ' rows)').join('\n') : 'All machine names matched.');
    FACTORIES.forEach(f => {
      const mine = rows.filter(r => r.factory === f), keys = {}, withMod = {}, missing = [];
      mine.forEach(r => { keys[r.machineKey] = r; if (r.product) withMod[r.machineKey] = 1; });
      Object.keys(keys).forEach(k => { if (!withMod[k] && missing.length < 6) missing.push(keys[k].machineRaw + (keys[k].machineNo ? ' ' + keys[k].machineNo : '')); });
      out.push(f + ': log rows ' + mine.length + ' | machines ' + Object.keys(keys).length + ' | machines with a module ' + Object.keys(withMod).length +
        ' | rows with a module ' + mine.filter(r => r.product).length + (missing.length ? '\n   no module yet: ' + missing.join(', ') : ''));
    });
    $('checkOut').textContent = out.join('\n\n');
  } catch (e) { $('checkOut').textContent = String(e.message || e); }
}
let started = false;
async function start() {
  if (started) return; started = true;
  $('login').hidden = true; $('app').hidden = false;
  await review(true);
  let tm; supabaseClient.channel('pr_logs_watch').on('postgres_changes', { event: '*', schema: 'public', table: 'pr_logs' },
    () => { clearTimeout(tm); tm = setTimeout(() => review(true), 1500); }).subscribe();   // edits in the table -> re-check + pop-up
}
$('btnIn').onclick = async () => {
  const { error } = await supabaseClient.auth.signInWithPassword({ email: $('em').value, password: $('pw').value });
  if (error) $('loginMsg').textContent = error.message; else start();
};
$('bIssues').onclick = () => rpc('pr_add_new_issues', 'pr_issue_mapping');
$('bMach').onclick = () => rpc('pr_add_new_machines', 'pr_machine_mapping');
$('bSkill').onclick = () => rpc('pr_add_skill_names', 'pr_skill_map');
$('bCheck').onclick = checks;
supabaseClient.auth.getSession().then(({ data }) => { if (data.session) start(); });
</script></main></body></html>
